<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do list</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="icon" href="./asset/apple-touch-icon.png">
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/2480d4e00e.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <h2>To Do List</h2>
    </header>
    <div class="container">
        <div class="row">
            <div class="col-12 mt-5" style="text-align: center;">
                <input type="text" class="form-input p-2" id="inputTask" placeholder="What do you need to do today?" style="width: 50%;">
            </div>
            <div class="col-12 mt-2" style="text-align: center;">
                <button type="submit" class="btn btn-success" id="addBtn">Add Task</button><br>
            </div>

            <div class="col-12">
                <table class="table table-striped mt-5 border" style="text-align: center;">
                    <thead>
                        <tr>
                            <th></th>
                          <th scope="col">Task</th>
                          <th scope="col">Status</th>
                          <th scope="col" colspan="2">Actions</th>
                        </tr>
                      </thead>
                      <tbody>
                       

                      </tbody>
                </table>
                <div id="noTask">
                    <p>No task added!</p>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
